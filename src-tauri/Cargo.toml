[package]
name = "llm-usage-monitor"
version = "0.1.0"
description = "A local-first Codex and Claude Code subscription usage HUD"
authors = ["LLM Usage Monitor"]
edition = "2021"

[lib]
name = "llm_usage_monitor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
