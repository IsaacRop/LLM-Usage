        <rect x="13" y="13" width="22" height="22" rx="7" fill="#FFB778" fill-opacity=".15" stroke="#FFB778" stroke-opacity=".36"/>
        <text x="21" y="28" fill="#FFB778" font-size="9" font-weight="700">A</text><text x="44" y="28" fill="#EDF3FB" font-size="10" font-weight="650">CLAUDE</text>
