        <rect x="13" y="13" width="22" height="22" rx="7" fill="#90B8FF" fill-opacity=".15" stroke="#90B8FF" stroke-opacity=".36"/>
        <text x="21" y="28" fill="#90B8FF" font-size="9" font-weight="700">G</text><text x="44" y="28" fill="#EDF3FB" font-size="10" font-weight="650">GEMINI</text>
