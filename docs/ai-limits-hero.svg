        <text x="13" y="55" fill="#909DB0" font-size="8">SESSION</text><text x="281" y="56" fill="#FFB778" font-size="14" font-weight="650">67%</text>
        <rect x="13" y="66" width="300" height="7" rx="3.5" fill="white" fill-opacity=".075"/><rect x="13" y="66" width="201" height="7" rx="3.5" fill="#FFB778"/>
        <text x="13" y="88" fill="#738197" font-size="7">33% remaining</text><text x="251" y="88" fill="#FFB778" fill-opacity=".82" font-size="7">Resets in 1h</text>
