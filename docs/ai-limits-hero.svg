<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LLM Usage</title>
  <desc id="desc">Local usage monitor for Codex, Claude Code and Gemini CLI</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1134" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26344D"/><stop offset=".48" stop-color="#111A2A"/><stop offset="1" stop-color="#090E18"/>
    </linearGradient>
    <radialGradient id="blueAura" cx="0" cy="0" r="1" gradientTransform="translate(180 20) rotate(43) scale(560 420)" gradientUnits="userSpaceOnUse">
