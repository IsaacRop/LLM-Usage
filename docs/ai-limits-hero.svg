  <rect x="1" y="1" width="1198" height="518" rx="30" fill="url(#violetAura)"/>
  <path d="M2 2H1198V142C970 83 776 90 584 146C382 205 194 199 2 126V2Z" fill="white" fill-opacity=".025"/>

